<body>
    <section>

            allowfullscreen></iframe>
        <h3>Tarea B</h3>
        <embed type="application/pdf" width="100%" height="500px" src="media/apuntes.pdf" />
        <h3>Tarea C</h3>
        <object type="text/html" data="https://www.wikipedia.org"></object>
    </section>

    <section>
        <h2>Seccion 2</h2>
        <h3>Tarea A</h3>
        <video controls>
            <source src="media/muestra.mp4" type="video/mp4">
            <source src="media/muestra.webm" type="video/webm">
            Error: Tu navegador no soporta el tag de video.
        </video>
        <h3>Tarea B</h3>
        <audio controls>
            <source src="media/pista.mp3" type="audio/mpeg">
            <source src="media/pista.ogg" type="audio/ogg">
            Error: Tu navegador no soporta el tag de video.
        </audio>
    </section>

    <section>
        <h2>Seccion 3</h2>
        <h3>Tarea A</h3>
        <svg width="200" height="200">
            <rect width="100%" height="100%" fill="blue" />
            <circle cx="100" cy="100" r="50" fill="yellow" stroke="red" stroke-width="10" />
        </svg>
        <h3>tarea B</h3>
        <canvas id="miLienzo" width="300" height="150">
            Tu navegador no soporta el elemento Canvas
            <script>
                const canvas = document.getElementById('miLienzo');
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'green';
                ctx.fillRect(10, 10, 150, 80);
                ctx.moveTo(0, 0);
                ctx.lineTo(200, 100);
                ctx.stroke(); 
            </script>

        </canvas>
    </section>
