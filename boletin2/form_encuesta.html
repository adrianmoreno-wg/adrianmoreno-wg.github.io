<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Preferencia de Desarrollo</title>
</head>
<body>
    <form action="https://lm.ciclo.iesnervion.es/encuesta.php" method="post">
        <fieldset>
            <legend><b><u>Datos Academicos</u></b></legend>
            <label for="nombreApellidos">Nombre y Apellidos:</label>
            <input type="text" id="nombreApellidos" name="nombreApellidos" maxlength="50" required><br>
            <label for="ciclo">Ciclo Formativo:</label>
            <select>
                <option value="DAM" selected>DAM</option>
                <option value="DAW">DAW</option>
                <option value="ASIR">ASIR</option>
            </select>
        </fieldset>
        <fieldset>
            <legend><b><u>Preferencias Tencinas</u></b></legend>
            <p><b>Lenguaje de programacion</b></p>
            <input type="radio" id="java" name="lenguaje" value="java">
            <label for="java">Java</label><br>
            <input type="radio" id="python" name="lenguaje" value="phyton">
            <label for="phyton">Phyton</label><br>
            <input type="radio" id="c#" name="lenguaje" value="c#">
            <label for="c#">C#</label><br>
            <input type="radio" id="javascript" name="lenguaje" value="javascript">
            <label for="javascript">JavaScript</label><br>
            <p><b>Entorno de desarrollo</b></p>
            <input type="checkbox" id="entorno-windows" name="entorno-windows" value="windows">
            <label for="entorno-windows">Windows</label>
            <input type="checkbox" id="entorno-linux" name="entorno-linux" value="linux">
            <label for="entorno-linux">Linux</label>
            <input type="checkbox" id="entorno-macos" name="entorno-macos" value="macos">
            <label for="entorno-macos">macOS</label>
        </fieldset>
        <button type="reset">Restablecer</button><br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
