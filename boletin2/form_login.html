<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Autenticacion Basico</title>
</head>
<body>
    <form action="https://lm.ciclo.iesnervion.es/login.php." method="POST">
        <label for="usuario">Nombre de usuario:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Tu nombre" required><br>
        <label for="contraseña">Contraseña:</label>
        <input type="password" id="contraseña" name="contraseña" required><br>
        <label for="sesion">Recordar sesion:</label>
        <input type="checkbox" id="sesion" name="sesion" value="aceptar"><br>
        <button type="submit">Iniciar sesion</button>
    </form>
</body>
</html>
