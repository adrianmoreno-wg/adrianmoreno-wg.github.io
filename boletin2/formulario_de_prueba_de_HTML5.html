<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de prueba de HTML5</title>
</head>
<body>
    <form action="https://lm.ciclo.iesnervion.es/registroweb.php" method="get">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required autofocus><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" nombre="email" required><br><br>
        <label for="url">URL:</label>
        <input type="url" id="url" name="url" placeholder="Escribe la URL de tu pagina web personal"><br><br>
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha"><br><br>
        <label for="tiempo">Tiempo:</label>
        <input type="date" id="tiempo" name="tiempo"><br><br>
        <label for="fechahora">Fechahora:</label>
        <input type="datetime" id="fechahora" name="fechahora"><br><br>
        <label for="mes">Mes:</label>
        <input type="month" name="mes" id="mes"><br><br>
        <label for="semana">Semana:</label>
        <input type="week" name="semana" id="semana"><br><br>
        <label for="numero">Numero:</label>
        <input type="number" name="numero" id="numero" min="-10" max="10"><br><br>
        <label for="telefono">Telefono:</label>
        <input type="tel" name="telefono" id="telefono"><br><br>
        <label for="busqueda">Termino de busqueda:</label>
        <input type="search" name="busqueda" id="busqueda"><br><br>
        <label for="color">Color favorito:</label>
        <input type="color" name="color" id="color"><br><br>
        <button type="submit">Enviar</button>
    </form>
    
</body>
</html>
