<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura basica HTML</title>
</head>
<body>
    <p>Lenguaje HTML</p>
    <hr>
    <sub>Subindice</sub>
    <p><strong>En negrita</strong></p>
    <p><em>En cursiva</em></p>
    <p><u>Subrayado</u></p>
    <p><sup>Superindice</sup></p>
    <div>
        <p>En bloque div</p>
    </div>
    <br>
    <ol>
        <li>X</li>
        <li>Y
            <ol type="1">
                <li>X2</li>
                <li>Y2</li>
            </ol>
        </li>
        <li>Z</li>
    </ol>
    <ul>
        <li>X</li>
        <li>Y</li>
        <li><ul>
            <li>X2</li>
            <li>Y2</li>
        </ul></li>
        <li>Z</li>
    </ul>
</body>
</html>
